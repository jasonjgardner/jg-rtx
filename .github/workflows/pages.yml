name: Deploy site

# Builds the customizer and publishes it to GitHub Pages.
#
# The generated catalog under `src/data/` is committed to this branch, so a
# deploy needs no checkout of the 542 MB pack — see `catalog.yml`, which
# refreshes it. That keeps deploys to seconds instead of minutes.

on:
  push:
    branches: [pages]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the catalog is present
        run: |
          for file in blocks sets varieties meta pack-files history; do
            if [ ! -s "src/data/$file.json" ]; then
              echo "::error::src/data/$file.json is missing or empty. Run the 'Refresh catalog' workflow."
              exit 1
            fi
          done

      - name: Test
        run: bun test

      - name: Type check
        run: bunx astro check

      # Must precede the build: it supplies the origin and base path the site
      # is compiled against.
      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        run: bun run build
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
